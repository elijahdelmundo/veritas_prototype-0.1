<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Planned secure clinic workflow</title><desc id="desc">Planned only: authentication and authorization permit branch operations, manager approvals, persistent reports and audit records, central monitoring and human follow-up. Denials are recorded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#9690A5"/></marker></defs><rect width="1120" height="760" rx="20" fill="#FCFBFE"/><g font-family="Segoe UI,Arial,sans-serif"><text x="560" y="35" text-anchor="middle" fill="#7C55C7" font-size="13" font-weight="500"><tspan x="560" dy="0">PLANNED CLINIC WORKFLOW</tspan></text><rect x="330" y="65" width="460" height="65" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="560" y="102.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Authenticate user</tspan></text><path d="M560 130 V165" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M560 165 790 217.5 560 270 330 217.5Z" fill="#F9F4FE" stroke="#D9C7EF"/><text x="560" y="222.5" text-anchor="middle" fill="#332D40" font-size="14" font-weight="500"><tspan x="560" dy="0">Authorize role, branch and action</tspan></text><path d="M790 217 H845" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="799.4" y="190" width="31.2" height="23" rx="6" fill="#FCFBFE"/><text x="815" y="205" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="815" dy="0">Deny</tspan></text><rect x="845" y="185" width="245" height="65" rx="14" fill="#FFF2F2" stroke="#EED8D8"/><text x="967.5" y="222.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="967.5" dy="0">Deny and record outcome</tspan></text><path d="M560 270 V315" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="564.5" y="283" width="39" height="23" rx="6" fill="#FCFBFE"/><text x="584" y="298" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="584" dy="0">Allow</tspan></text><rect x="330" y="315" width="460" height="65" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="560" y="352.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Permitted branch operations</tspan></text><path d="M560 380 V415" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="330" y="415" width="460" height="65" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="560" y="452.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Manager review and required approvals</tspan></text><path d="M560 480 V515" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="330" y="515" width="460" height="65" rx="14" fill="#EAF7F0" stroke="#CFE7DA"/><text x="560" y="552.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Persist reports, events and audit history</tspan></text><path d="M560 580 V615" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="330" y="615" width="460" height="55" rx="14" fill="#EDF5FD" stroke="#D1E1EF"/><text x="560" y="647.5" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Authorized Pasig / owner monitoring</tspan></text><path d="M560 670 V705" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="330" y="705" width="460" height="40" rx="14" fill="#EAF7F0" stroke="#CFE7DA"/><text x="560" y="730" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="560" dy="0">Human follow-up and resolution</tspan></text></g></svg>
