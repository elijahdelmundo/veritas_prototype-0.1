<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc"><title id="title">Flutter, REST API and Laravel architecture</title><desc id="desc">Flutter screens interact with ClinicStore and ClinicApi. HTTP JSON requests go to Laravel routes, validation, Eloquent models and SQLite. JSON resources and confirmed results return to the frontend.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#8C829C"/></marker></defs><rect width="1280" height="510" rx="20" fill="#FCFBFE"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="30" y="70" width="440" height="370" rx="22" fill="#F3EEFC"/><rect x="560" y="70" width="420" height="370" rx="22" fill="#EDF8F3"/><rect x="1025" y="170" width="240" height="220" rx="22" fill="#EEF5FD"/><text x="250" y="45" text-anchor="middle" font-size="14" font-weight="500" fill="#7C55C7"><tspan x="250" dy="0">FLUTTER FRONTEND</tspan></text><text x="770" y="45" text-anchor="middle" font-size="14" font-weight="500" fill="#348B73"><tspan x="770" dy="0">LARAVEL REST API</tspan></text><text x="1145" y="145" text-anchor="middle" font-size="14" font-weight="500" fill="#4D7EAE"><tspan x="1145" dy="0">PERSISTENCE</tspan></text><rect x="60" y="110" width="380" height="70" rx="14" fill="#fff" stroke="#DDD6EA"/><text x="250" y="150" text-anchor="middle" font-size="16" font-weight="500" fill="#332D40"><tspan x="250" dy="0">Flutter screens and forms</tspan></text><rect x="60" y="220" width="380" height="70" rx="14" fill="#fff" stroke="#DDD6EA"/><text x="250" y="260" text-anchor="middle" font-size="16" font-weight="500" fill="#332D40"><tspan x="250" dy="0">ClinicStore / ChangeNotifier</tspan></text><rect x="60" y="330" width="380" height="70" rx="14" fill="#fff" stroke="#DDD6EA"/><text x="250" y="370" text-anchor="middle" font-size="16" font-weight="500" fill="#332D40"><tspan x="250"