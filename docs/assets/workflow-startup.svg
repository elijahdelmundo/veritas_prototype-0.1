<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1050" viewBox="0 0 1080 1050" role="img" aria-labelledby="title desc"><title id="title">Application startup and navigation</title><desc id="desc">The current startup workflow: choose explicit demo or API loading, retry failures, cache results, display the dashboard, select scope and refresh.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#9690A5"/></marker></defs><rect width="1080" height="1050" rx="20" fill="#FCFBFE"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="340" y="40" width="320" height="70" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="500" y="80" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="500" dy="0">Launch Flutter</tspan></text><path d="M500 155 680 205 500 255 320 205Z" fill="#F9F4FE" stroke="#D9C7EF"/><text x="500" y="200" text-anchor="middle" fill="#332D40" font-size="14" font-weight="500"><tspan x="500" dy="0">Explicit sample-data</tspan><tspan x="500" dy="20.3">mode?</tspan></text><path d="M500 110 V155" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M500 255 V325" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="512.2" y="278" width="15.6" height="23" rx="6" fill="#FCFBFE"/><text x="520" y="293" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="520" dy="0">No</tspan></text><path d="M320 205 H155 V325" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="223.3" y="185" width="23.4" height="23" rx="6" fill="#FCFBFE"/><text x="235" y="200" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="235" dy="0">Yes</tspan></text><rect x="40" y="325" width="230" height="80" rx="14" fill="#FDEFF7" stroke="#F0D5E7"/><text x="155" y="360" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="155" dy="0">Create in-memory</tspan><tspan x="155" dy="21.75">demo</tspan></text><rect x="340" y="325" width="320" height="80" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="500" y="360" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="500" dy="0">GET branches, reports</tspan><tspan x="500" dy="21.75">and medicine batches</tspan></text><path d="M500 405 V465" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M500 465 680 515 500 565 320 515Z" fill="#F9F4FE" stroke="#D9C7EF"/><text x="500" y="510" text-anchor="middle" fill="#332D40" font-size="14" font-weight="500"><tspan x="500" dy="0">All requests</tspan><tspan x="500" dy="20.3">succeed?</tspan></text><path d="M680 515 H740" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="702.2" y="491" width="15.6" height="23" rx="6" fill="#FCFBFE"/><text x="710" y="506" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="710" dy="0">No</tspan></text><rect x="740" y="475" width="230" height="80" rx="14" fill="#FFF5EB" stroke="#ECDDCB"/><text x="855" y="510" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="855" dy="0">Show connection error</tspan><tspan x="855" dy="21.75">and Retry</tspan></text><path d="M855 475 V365 H660" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M500 565 V635" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="511.3" y="588" width="23.4" height="23" rx="6" fill="#FCFBFE"/><text x="523" y="603" text-anchor="middle" fill="#796E8C" font-size="13" font-weight="500"><tspan x="523" dy="0">Yes</tspan></text><rect x="340" y="635" width="320" height="80" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="500" y="670" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="500" dy="0">Store returned records</tspan><tspan x="500" dy="21.75">in UI cache</tspan></text><path d="M500 715 V785" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="340" y="785" width="320" height="80" rx="14" fill="#EAF7F0" stroke="#CFE7DA"/><text x="500" y="830" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="500" dy="0">Owner dashboard</tspan></text><path d="M155 405 V825 H340" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M500 865 V935" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="340" y="935" width="320" height="70" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="500" y="975" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="500" dy="0">Choose branch and section</tspan></text><path d="M660 825 H740" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="740" y="785" width="230" height="80" rx="14" fill="#EDF5FD" stroke="#D1E1EF"/><text x="855" y="830" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="855" dy="0">Refresh clinic data</tspan></text><path d="M970 825 H1030 V365 H660" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/></g></svg>
