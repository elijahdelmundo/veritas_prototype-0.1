<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">Confirmed report save sequence</title><desc id="desc">User saves a report. Flutter validates and disables repeat submission, Laravel validates and persists a unique branch/date report, then the response updates the cache and closes the form.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#9690A5"/></marker></defs><rect width="1160" height="850" rx="20" fill="#FCFBFE"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="20" y="35" width="160" height="60" rx="14" fill="#FDEFF7" stroke="#DFD5F1"/><text x="100" y="70" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="100" dy="0">User</tspan></text><path d="M100 95 V805" stroke="#DAD6E3" stroke-dasharray="5 6"/><rect x="325" y="35" width="160" height="60" rx="14" fill="#F2EEFC" stroke="#DFD5F1"/><text x="405" y="70" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="405" dy="0">Flutter form</tspan></text><path d="M405 95 V805" stroke="#DAD6E3" stroke-dasharray="5 6"/><rect x="675" y="35" width="160" height="60" rx="14" fill="#EAF7F0" stroke="#DFD5F1"/><text x="755" y="70" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="755" dy="0">Laravel API</tspan></text><path d="M755 95 V805" stroke="#DAD6E3" stroke-dasharray="5 6"/><rect x="980" y="35" width="160" height="60" rx="14" fill="#EDF5FD" stroke="#DFD5F1"/><text x="1060" y="70" text-anchor="middle" fill="#332D40" font-size="15" font-weight="500"><tspan x="1060" dy="0">Database</tspan></text><path d="M1060 95 V805" stroke="#DAD6E3" stroke-dasharray="5 6"/><path d="M100 165 H405" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="252.5" y="147" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="252.5" dy="0">Save report</tspan></text><path d="M405 245 H470 V277 H405" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="550" y="230" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="550" dy="0">Validate and disable</tspan><tspan x="550" dy="18.849999999999998">repeat submission</tspan></text><path d="M405 330 H755" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="580" y="312" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="580" dy="0">PUT branch/date report JSON</tspan></text><path d="M755 415 H820 V447 H755" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="900" y="400" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="900" dy="0">Validate fields and date</tspan></text><path d="M755 500 H1060" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="907.5" y="482" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="907.5" dy="0">Create or update</tspan><tspan x="907.5" dy="18.849999999999998">unique branch/date</tspan></text><path d="M1060 585 H755" stroke="#9690A5" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="907.5" y="567" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="907.5" dy="0">Stored record</tspan></text><path d="M755 675 H405" stroke="#9690A5" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="580" y="657" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="580" dy="0">200 with persisted report</tspan></text><path d="M405 755 H470 V787 H405" stroke="#9690A5" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="550" y="740" text-anchor="middle" fill="#332D40" font-size="13" font-weight="500"><tspan x="550" dy="0">Replace cache, recalculate totals,</tspan><tspan x="550" dy="18.849999999999998">close form</tspan></text></g></svg>
